[package]
name = "difftacular"
version = "0.1.2"
description = "A visual desktop frontend for difftastic"
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
difftastic = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.10.2", features = [] }
tauri-plugin-dialog = "=2.6.0"
# Keep Tauri's runtime crates on the API generation expected by 2.10. Cargo's
# semver resolver can otherwise select 2.11 here, which changed a callback
# bound without a major-version bump.
tauri-runtime = "=2.10.0"
tauri-runtime-wry = "=2.10.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
